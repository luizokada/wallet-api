spring.application.name=api
spring.config.import=optional:file:.env[.properties]
spring.web.error.include-stacktrace=never
spring.datasource.url = jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username = ${POSTGRES_USER}
spring.datasource.password = ${POSTGRES_PASSWORD}
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.jackson.deserialization.fail-on-unknown-properties=true
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
app.password-reset.expiration-minutes=30

supabase.storage.bucket=${SUPABASE_BUCKET_NAME}
supabase.storage.public-url=${SUPABASE_BUCKET_URL}
supabase.storage.endpoint=${SUPABASE_S3_ENDPOINT}
supabase.storage.region=${SUPABASE_S3_REGION:us-east-1}
supabase.storage.access-key=${SUPABASE_BUCKET_ACCESS_KEY}
supabase.storage.secret-key=${SUPABASE_BUCKET_SECRET_KEY}

gemini.api-key=${GOOGLE_GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:20}
gemini.min-confidence=${GEMINI_MIN_CONFIDENCE:0.7}
gemini.rate-limit-seconds=${GEMINI_RATE_LIMIT_SECONDS:30}

app.avatar.max-size-bytes=2097152
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB